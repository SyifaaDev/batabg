plugins {
    id 'com.android.application'
}

android {
    namespace 'com.informasipasar.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.informasipasar.app'
        // Android 5.0 (Lollipop) ke atas
        minSdk 21
        // Target versi Android terbaru
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Pakai debug key supaya APK langsung bisa di-install tanpa keystore
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
}
